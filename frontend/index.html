<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H-KFX Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mongo: '#00ED64',
              tavily: '#2E96FF',
              dark: '#0F172A',
              card: '#1E293B',
            },
            animation: {
              'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'flow': 'flow 2s linear infinite',
            },
            keyframes: {
              flow: {
                '0%': { strokeDashoffset: '20' },
                '100%': { strokeDashoffset: '0' },
              }
            }
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #0F172A;
        color: #F8FAFC;
        font-family: 'Inter', sans-serif;
        overflow: hidden; /* Prevent scrolling on the main canvas */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1E293B; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748B; 
      }
    </style>
